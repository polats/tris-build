# Builds a compact headless Linux x86_64 Angelo tarball (Rocky Linux 8 / glibc 2.28 / gcc-toolset-14)
# for ghcr.io/polats/tris-box, publishes it as a GitHub Release on polats/tris-build,
# and triggers `box.yml` to bake it into ghcr.io/polats/tris-box:1.
name: angelo linux headless

on:
  workflow_dispatch:
    inputs:
      angelo_ref:
        description: "Tag or branch of call-me-sensei-app/angelo to build"
        required: false
        default: "v2.1.0"
      trigger_box_build:
        description: "Rebuild ghcr.io/polats/tris-box:1 with this tarball after publishing"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout Angelo source
        uses: actions/checkout@v4
        with:
          repository: call-me-sensei-app/angelo
          ref: ${{ inputs.angelo_ref || 'v2.1.0' }}
          path: angelo
          fetch-depth: 1
          lfs: false

      - name: Fetch Linux x86_64 precompiled libraries (lib/linux_x64)
        working-directory: angelo
        run: |
          git lfs install --local --skip-repo
          git -c submodule.lib/linux_x64.update=checkout submodule update --init --depth 1 lib/linux_x64
          git -C lib/linux_x64 lfs install --local --skip-repo
          git -C lib/linux_x64 lfs pull

      - name: Build Rocky Linux 8 (glibc 2.28 + gcc-toolset-14) build image
        run: |
          docker build -t angelo-rocky8 \
            -f angelo/build_files/build_environment/linux/angelo_rocky8.Containerfile \
            angelo/build_files/build_environment/linux

      - name: Compile headless Linux x86_64 Angelo (blender_lite + WITH_HEADLESS)
        run: |
          mkdir -p build dist
          docker run --rm \
            -v "$PWD/angelo:/src" \
            -v "$PWD/build:/build" \
            -w /src \
            angelo-rocky8 \
            bash -lc '
              set -euo pipefail
              source /opt/rh/gcc-toolset-14/enable
              cmake -S /src -B /build -G Ninja \
                -C /src/build_files/cmake/config/blender_lite.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/build/install \
                -DWITH_HEADLESS=ON \
                -DWITH_OPENSUBDIV=ON \
                -DWITH_IMAGE_WEBP=ON \
                -DWITH_BUILDINFO=ON \
                -DWITH_ASSERT_ABORT=OFF \
                -DWITH_INSTALL_PORTABLE=ON
              cmake --build /build --target install --parallel "$(nproc)"
            '

      - name: Smoke-test inside ghcr.io/getpaseo/paseo:0.16.1 (tris-box base)
        run: |
          BIN="$( [ -x build/install/angelo ] && echo /opt/angelo/angelo || echo /opt/angelo/blender )"
          docker run --rm \
            -v "$PWD/build/install:/opt/angelo:ro" \
            ghcr.io/getpaseo/paseo:0.16.1 \
            "$BIN" --background --factory-startup --python-expr \
              "import bpy, addon_utils; addon_utils.enable('angelo_agent', default_set=False, persistent=False); from angelo_agent import collision_fit, engine_preflight, library_catalog; print('ANGELO_LINUX_OK', bpy.app.version_string, hasattr(bpy.ops.object, 'retopology'))"

      - name: Pack Angelo headless tarball
        run: |
          VER="${{ inputs.angelo_ref || 'v2.1.0' }}"
          TARBALL="Angelo-${VER}-headless-linux-x64.tar.xz"
          mkdir -p "dist/angelo-${VER}"
          cp -a build/install/. "dist/angelo-${VER}/"
          if [ ! -e "dist/angelo-${VER}/angelo" ] && [ -x "dist/angelo-${VER}/blender" ]; then
            ln -s blender "dist/angelo-${VER}/angelo"
          fi
          tar -C dist -cJf "dist/${TARBALL}" "angelo-${VER}"
          ls -lh "dist/${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "TAG=angelo-${VER}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release on polats/tris-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "dist/${TARBALL}" \
            --repo "${{ github.repository }}" \
            --title "Angelo ${TAG} (Headless Linux x86_64)" \
            --notes "Headless CPU-only Linux x86_64 build of Angelo for ghcr.io/polats/tris-box." \
            --clobber || \
          gh release upload "$TAG" "dist/${TARBALL}" --repo "${{ github.repository }}" --clobber
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${TARBALL}"
          echo "RELEASE_URL=${URL}" >> "$GITHUB_ENV"
          echo "Published: ${URL}"

      - name: Trigger box image rebuild with ANGELO_LINUX_URL
        if: ${{ inputs.trigger_box_build != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run box.yml \
            --repo "${{ github.repository }}" \
            -f angelo_linux_url="${RELEASE_URL}"
